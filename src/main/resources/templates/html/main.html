<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Main Dashboard - Study Planner</title>
    <link rel="stylesheet" href="../../assets/styles/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="notebook">
    <header class="main-header">
        <div class="header-left"></div>
        <div class="header-center">
            <p class="user-welcome"><strong>OOO</strong>님! 반가워요</p>
        </div>
        <div class="header-right">
            <div class="point-box">
                <span class="point-emoji">✅</span>
                <span id="userPoints" class="point-text">4583점</span>
            </div>
            <div class="profile-box">
                <span class="profile-icon">👤</span>
                <button id="logoutBtn">로그아웃</button>
            </div>
        </div>
    </header>

    <hr class="section-divider">

    <section class="status-container">
        <div class="risk-circle">
            <div class="risk-inner">
                <span class="risk-label">위험도</span>
                <span id="riskStatus" class="risk-value">주의</span>
                <div class="risk-alert" id="riskAlert">!
                    <div class="risk-tooltip" id="riskTooltip"></div>
                </div>
            </div>
        </div>
        <div id="progressCard" class="progress-card">
            <!-- JS에서 진행률 바 생성 -->
        </div>
    </section>

    <hr class="section-divider">

    <section class="goal-container">
        <h2 class="goal-title">진행 중 목표 D-DAY🗓️</h2>
        <ul id="goalList" class="goal-list"></ul>
    </section>

    <section class="todo-container">
        <h2 class="todo-title">오늘 해야 할 일</h2>
        <div id="todoListArea"></div>
    </section>

    <hr class="section-divider">

    <section class="card-news-eval">
        <div class="eval-card">
            <h2 class="eval-title">오늘의 나</h2>
            <p class="eval-q">오늘 목표를 위해 얼마나 노력했나요?</p>
            <div class="number-rating">
                <button class="num-btn" data-val="1">1</button>
                <button class="num-btn" data-val="2">2</button>
                <button class="num-btn" data-val="3">3</button>
                <button class="num-btn" data-val="4">4</button>
                <button class="num-btn" data-val="5">5</button>
            </div>
            <button id="saveEvalBtn" class="eval-submit-btn">평가 완료</button>
            <div class="avg-display-box">
                <p class="avg-label">목표 전체 평균 집중도</p>
                <p class="avg-value"><span id="avgScore">0.0</span> <small>/ 5.0</small></p>
            </div>
        </div>
    </section>
</div>

<button id="createGoalBtn">+ 목표 생성하기</button>

<script src="../../static/assets/scripts/main.js"></script>

<!-- 목표 달성 모달 -->
<div id="successModal" class="modal">
    <div class="modal-content">
        <h2>목표 달성!</h2>
        <p id="successMessage"></p>
        <button id="closeModalBtn">확인</button>
    </div>
</div>
</body>
</html>
