<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>My Page</title>
    <link rel="stylesheet" href="../../assets/styles/myPage.css">
    <script defer src="../../assets/scripts/myPage.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <header>
        <button class="headerBtn">←</button>
        <h2>My Page</h2>
        <button class="headerBtn">⚙</button>
    </header>

    <div class="top">

        <div class="profile">
            <div class="avatar"></div>
            <p class="points">☕ 4583</p>
        </div>

        <div class="goals" id="goals"></div>

    </div>

    <div class="calendar-header">
        <button class="calendarBtn" onclick="changeMonth(-1)">«</button>
        <h3 id="month"></h3>
        <button class="calendarBtn" onclick="changeMonth(1)">»</button>
    </div>

    <div class="calendar" id="calendar"></div>

    <div class="stats">
        <h3>월간 공부 통계</h3>
        <canvas id="chart"></canvas>
    </div>

</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3>목표 수정</h3>

        <label>목표 이름</label>
        <input type="text" id="editName">

        <label>날짜</label>
        <input type="date" id="editDate">

        <label>공부 시간 (시간)</label>
        <input type="number" id="editTime">

        <div class="modal-buttons">
            <button onclick="saveGoal()">저장</button>
            <button onclick="closeModal()">취소</button>
        </div>
    </div>
</div>

</body>
</html>
