<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>회원가입</title>
<link rel="stylesheet" href="signup.css">
</head>

<body>

<div class="notebook">

<div class="spring">
<div class="ring"></div>
<div class="ring"></div>
<div class="ring"></div>
<div class="ring"></div>
<div class="ring"></div>
<div class="ring"></div>
<div class="ring"></div>
</div>

<h1>회원 가입</h1>
<p class="subtitle">당신만의 플래너를 시작해보세요</p>

<form>

<div class="form-group">
<input type="text" class="input-field" placeholder="이름">
</div>

<div class="form-group">
<div class="id-row">
<input type="text" class="input-field" id="idInput" placeholder="아이디">
<button type="button" onclick="checkId()">중복확인</button>
</div>
<p id="idMessage"></p>
</div>

<!------- 이메일 인증 ------->
<div class="form-group">

<div class="id-row">
<input type="email" class="input-field" id="emailInput" placeholder="이메일">
<button type="button" onclick="sendCode()">인증번호 받기</button>
</div>

<p id="emailMessage"></p>

<div class="id-row">
<input type="text" class="input-field" id="codeInput" placeholder="인증번호 입력" maxlength="6" inputmode="numeric">
<button type="button" onclick="checkCode()">인증하기</button>
</div>

<p id="codeMessage"></p>

</div>

<div class="form-group">
<input type="password" class="input-field" id="passwordInput" placeholder="비밀번호">
<p class="password-rule">
* 영문 소문자 + 숫자 포함, 10자 이상
</p>
<p id="passwordMessage"></p>
</div>

<div class="form-group">
<input type="password" class="input-field" id="passwordCheck" placeholder="비밀번호 확인">
<p id="passwordCheckMessage"></p>
</div>

<button class="signup-btn">회원가입</button>

</form>

<p class="login-link">
이미 계정이 있으신가요? <a href="login.html">로그인</a>
</p>

</div>

<script src="signup.js"></script>

</body>
</html>
