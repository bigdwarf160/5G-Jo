<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>비밀번호 재설정</title>
<link rel="stylesheet" href="password.css">
</head>

<body>

<div class="container">

    <!------- 스프링 ------->
    <div class="spring">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
    </div>

    <h1>비밀번호 재설정</h1>

    <form onsubmit="return false;">

        <label>아이디 입력</label>
        <input type="text" placeholder="아이디">

        <label>새 비밀번호</label>
        <input type="password" id="password" placeholder="새 비밀번호">
        <p class="password-rule">* 영문 소문자 + 숫자 포함, 10자 이상</p>
        <p class="check" id="passwordFeedback"></p> <!------- 조건 메시지 ------->

        <label>새 비밀번호 확인</label>
        <div class="password-check">
            <input type="password" id="passwordConfirm" placeholder="비밀번호 확인">
            <span class="check" id="checkMsg"></span> <!------- 일치 메시지 ------->
        </div>

        <button type="submit">변경</button>

    </form>

</div>

<script src="password.js"></script>
</body>
</html>
