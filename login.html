<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="wrapper">

    <!------- 왼쪽 홍보 이미지 슬라이더 -------->
    <div class="promo">
    <div class="promo-slider">
        <div class="slide active" style="background-image: url('img1.jpg');"></div>
        <div class="slide" style="background-image: url('img2.jpg');"></div>
        <div class="slide" style="background-image: url('img3.jpg');"></div>
    </div>

    <!-------- < > 버튼 -------->
    <div class="promo-controls">
        <button class="prev">&lt;</button>
        <button class="next">&gt;</button>
    </div>
</div>

    </div>

    <!------- 오른쪽 로그인 ------->
    <div class="login-container">

        <!------- 스프링 ------->
        <div class="spring">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="ring"></div>
        </div>

        <!------- 로고 ------->
        <div class="logo"></div>

        <!------- 로고 문구 ------->
        <p class="logo-text">
            오늘을 계획하고, 내일의 나를 완성해요.
        </p>

        <!------- 제목 ------->
        <h1 class="title">로그인</h1>

        <!------- 로그인 폼 ------->
        <form id="loginForm">

            <input type="text" id="username" placeholder="아이디">
            <input type="password" id="password" placeholder="비밀번호">

            <div class="options">
                <label>
                    <input type="checkbox" id="keepLogin">
                    로그인 상태 유지
                </label>

                <a href="password.html">비밀번호 재설정</a>
            </div>

            <button type="submit" class="login-btn">로그인</button>

        </form>

        <!------- 회원가입 ------->
        <p class="signup">
            아직 회원이 아니신가요?
            <a href="signup.html">회원가입</a>
        </p>

    </div>

</div>

<!------- js 파일 연결 ------->
<script src="login.js"></script>

</body>
</html>
